# because train.py interprets `epochs` as the final epoch, not extra epochs.
#
# Launch with:
#   python train.py --config config/ablation/flex_no_total_interp_steps_nskt_posttrain.yaml
#
# If your checkpoint filename differs, update `checkpoint_path` below.
run_name: FLEX_no_total_interp_steps_nskt_posttrain
