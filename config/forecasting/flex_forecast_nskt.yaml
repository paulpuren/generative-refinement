# One-step NSKT forecasting with a FLEX backbone.
# Training always uses x_t -> x_{t+1}; evaluation rolls this model out
# autoregressively for `forecast_horizon` steps.
run_name: FLEX_forecast_nskt
data_name: forecasting_nskt
model: FLEXForecast
flex_model_size: small
flex_mlp_ratio: 2
use_scalar_film: true
use_spatial_cond: true
spatial_cond_scales: [32, 16]
spatial_cond_mode: gated
reynolds_normalization_scale: 40000.0
forecast_baseline: persistence
ddp_find_unused_parameters: true
sampling_freq: 10
validation_freq: 5
optimizer: adam
epochs: 300
batch_size: 12
learning_rate: 1.0e-4
checkpoint_path: ""
resume_training: false
total_interp_steps_train: 1
is_T_fixed: true
forecast_train_horizon: 1
direct_horizon_loss_weight: 1.0
rollout_loss_weight: 0.0
rollout_batch_size: 0
forecast_conditioning_mode: forecast
patch_size: 256
stride: 32
scratch_dir: /global/cfs/cdirs/m4633/foundationmodel/nskt_tensor/
prediction_type: v
sampler: ddim
time_steps: 3
base_width: 128
wandb: false
