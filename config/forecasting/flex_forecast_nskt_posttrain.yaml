# Continue training one-step FLEXForecast on NSKT.
# forecasting/train.py interprets `epochs` as the final target epoch, not the
# number of extra epochs. With the checkpoint below at epoch 16, this resumes
# from epoch 16 and continues until epoch 300.
run_name: FLEX_forecast_nskt_posttrain
data_name: forecasting_nskt
model: FLEXForecast
flex_model_size: small
flex_mlp_ratio: 2
use_scalar_film: true
use_spatial_cond: true
spatial_cond_scales: [32, 16]
spatial_cond_mode: gated
reynolds_normalization_scale: 40000.0
forecast_baseline: persistence
ddp_find_unused_parameters: true
sampling_freq: 10
validation_freq: 5
optimizer: adam
epochs: 100 # 300
batch_size: 12
learning_rate: 1.0e-4
checkpoint_path: /pscratch/sd/p/puren93/puren/Interp-DM/checkpoints/checkpoint_Model_ft_FLEXForecast_ReNorm40000_small_mlp2_Data_forecasting_nskt_Optim_adam_cosine_lr0.0001_epoch300_patchsize256_stride32_oneStepForecast_last.pt
# checkpoints/checkpoint_Model_ft_FLEXForecast_small_mlp2_Data_forecasting_nskt_Optim_adam_cosine_lr0.0001_epoch300_patchsize256_stride32_oneStepForecast_last.pt
resume_training: true # false
total_interp_steps_train: 1
is_T_fixed: true
forecast_train_horizon: 1
direct_horizon_loss_weight: 1.0
rollout_loss_weight: 0.0
rollout_batch_size: 0
forecast_conditioning_mode: forecast
patch_size: 256
stride: 32
scratch_dir: /global/cfs/cdirs/m4633/foundationmodel/nskt_tensor/
prediction_type: v
sampler: ddim
time_steps: 3
base_width: 128
